name: gestionnaire-financier-local
services:
  finance-private-db:
    build: ./docker
    ports:
      - '127.0.0.1:5444:5432'
    environment:
      POSTGRES_DB: finance_private
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - private-local-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finance -d finance_private']
      interval: 3s
      timeout: 3s
      retries: 20
  finance-web:
    build: .
    ports:
      - '127.0.0.1:8093:8080'
    environment:
      APP_MODE: private
      AUTH_MODE: oidc
      APP_ORIGIN: http://127.0.0.1:8093
      SECURE_COOKIES: '0'
      OIDC_ISSUER: http://127.0.0.1:8098/realms/comptes
      OIDC_INTERNAL_ORIGIN: http://host.docker.internal:8098
      OIDC_CLIENT_ID: gestionnaire-financier
      OIDC_CLIENT_SECRET: '${OIDC_CLIENT_SECRET}'
      DATABASE_URL: 'postgresql+psycopg://finance:${DB_PASSWORD}@finance-private-db:5432/finance_private'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      finance-private-db:
        condition: service_healthy

volumes:
  private-local-data:
